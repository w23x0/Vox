[package]
name = "vox"
description = "Vox —— 实时语音翻译（装配层）"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "vox"

# 二进制名带 _lib 后缀是 Tauri 模板的约定，避免和 crate 名冲突。
[lib]
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 打包时必须开。开了 Tauri 才用自定义协议读嵌进二进制的前端资源；
# 不开的话即使是 release 构建，窗口也会去连 devUrl（127.0.0.1:5183），
# 用户装上打开就是一片"无法访问此页面"。
# `cargo tauri build` 会自动带上这个 feature，手工 `cargo build --release`
# 不会——所以手工出包务必加 `--features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]
steamvr-overlay = ["dep:openvr"]

[dependencies]
vox-core.workspace = true
vox-dsp.workspace = true
vox-net = { path = "../../crates/vox-net" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# 联网更新模型目录用。TLS 复用 workspace 里 rustls(ring) 那套，不引 native-tls。
# 进程级的 CryptoProvider 已由 vox-net::ws 里 install_default() 装好，reqwest 直接共享。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# OSC 是纯 UDP 发包，没有一行 Win32，两个平台共用。
vox-osc = { path = "../../crates/vox-osc" }

# 控制面（Agent 面）：MCP 2026-07-28 + 本机 Streamable HTTP。装配层只注入后端
# （`LedgerBackend` + 用户开关）并起停，协议面一行都不碰（`src/mcp.rs`）。
vox-mcp = { path = "../../crates/vox-mcp" }

# 共享宿主层（S4-A）。桌面档**开** `secret-service`：Linux 的密钥后端走
# gnome-keyring / KWallet（走 D-Bus），这是桌面档自己的既有选择。
# 无屏档不开——它用 0600 文件兜底，开了会让 `cargo tree -p vox-headless` 拖进 keyring/zbus。
vox-host = { workspace = true, features = ["secret-service"] }

[target.'cfg(windows)'.dependencies]
# `windows` 必须按 target 门控：它的 `windows-future` 子 crate 在非 Windows 上
# 编不过（`windows_threading::submit` 不存在），会直接把 Linux 的 workspace 检查
# 卡死在依赖树里。
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    # 进程句柄：`mcp.rs::process_alive`（OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION) /
    # CloseHandle）与 `commands.rs::close_cable_blockers`（TerminateProcess /
    # WaitForSingleObject / PROCESS_TERMINATE|PROCESS_SYNCHRONIZE）都在装配层直接调这些 Win32 API。
    # **防御性声明**：今天就算撤掉这一行也能编过——`cargo` 的 feature unification 会把
    # `vox-audio-win` 声明的同一个 feature 合进同一份依赖图，等于替这边开了。但装配层不该
    # 依赖别人的 feature（那是隐式契约）：两份都撤时
    # `cargo check --target x86_64-pc-windows-gnu --all-targets` 会以 E0432 失败。
    "Win32_System_Threading",
    # 窗口最小尺寸强制：WM_GETMINMAXINFO 需要 MINMAXINFO/SetWindowLongPtrW；
    # GetDpiForWindow 用来把逻辑最小尺寸按当前 DPI 换算成物理像素。
    "Win32_UI_HiDpi",
    # MessageBoxW：启动失败时唯一能让用户看见原因的手段。
    # 发布构建是 windows_subsystem="windows"，stderr 直接进黑洞。
    "Win32_UI_WindowsAndMessaging",
] }
openvr = { version = "0.9", optional = true }

# Windows 的三个外壳 crate：里面全是 Win32/WASAPI 调用，只在这里依赖。
vox-audio-win = { path = "../../crates/vox-audio-win" }
vox-input-win = { path = "../../crates/vox-input-win" }
vox-overlay-win = { path = "../../crates/vox-overlay-win" }

[target.'cfg(target_os = "linux")'.dependencies]
vox-audio-linux = { path = "../../crates/vox-audio-linux" }
vox-input-linux = { path = "../../crates/vox-input-linux" }
vox-overlay-linux = { path = "../../crates/vox-overlay-linux" }
# 问 D-Bus "有没有东西在显示托盘图标"（`platform::tray_host_available`）。
# zbus 本来就在依赖树里（vox-host 的 secret-service → keyring 拉的），这里只是直接用一次，不多编一个 crate。
zbus = "5"
