<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vox</title>
    <script>
      /*
       * 首帧前套用已存主题（UI_SPEC 第 5 节）。必须内联在 head 里同步执行 ——
       * 等 JS 模块加载完再套已经晚了，会先渲染亮色再跳暗色。
       * key 必须和 src/ui/theme.ts 的 KEY（"app-theme"）一致，否则暗色用户
       * 冷启动会先亮一下再跳暗。
       * 没存过 = 跟随系统：按 prefers-color-scheme 套（src/ui/theme.ts 同口径）。
       */
      (function () {
        try {
          var s = localStorage.getItem("app-theme");
          var dark =
            s === "dark" ||
            (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <style>
      /* 首帧防闪：html/body 直接铺 --bg，避免圆角外露出透明窗口背后的深色底。
         tokens.css 里同一样式再兜一次完整主题计算后的背景。 */
      html,
      body {
        background: var(--bg);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
