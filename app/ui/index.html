<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vox 设置</title>
    <script>
      /*
       * 首帧前套用已存主题（UI_SPEC 第 5 节）。必须内联在 head 里同步执行 ——
       * 等 JS 模块加载完再套已经晚了，会先渲染亮色再跳暗色。
       * key 必须和 src/ui/theme.ts 的 KEY（"app-theme"）一致，否则暗色用户
       * 冷启动会先亮一下再跳暗。
       * 没存过就不写 data-theme，让 CSS 里的系统偏好媒体查询生效。
       */
      (function () {
        try {
          var s = localStorage.getItem("app-theme");
          if (s === "dark" || s === "light")
            document.documentElement.setAttribute("data-theme", s);
        } catch (e) {}
      })();
    </script>
    <style>
      /* 首帧防闪：html/body 直接铺 --bg，避免圆角外露出透明窗口背后的深色底。
         tokens.css 里同一样式再兜一次完整主题计算后的背景。 */
      html,
      body {
        background: var(--bg);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
