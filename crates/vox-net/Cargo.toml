[package]
name = "vox-net"
description = "网络传输：云端 WS（vox-core::cloud::Transport）+ 媒体面音频管子"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vox-core.workspace = true
tracing.workspace = true
# `net` 是媒体面自己要的（TcpListener / TcpStream）。此前靠 tokio-tungstenite 的
# feature 合并带进来——别继续靠它。
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
# 进程级 CryptoProvider 只装一次，装完就不需要它的功能了，但这处 import 保证
# rustls 被拉进编译（Workspace 里声明了，但 crate 本身引用才真的生效）。
rustls.workspace = true
futures-util = "0.3.31"
# TLS 自己做（CloseCatcher 要套在 TLS 之上的明文流上），不再交给 tokio-tungstenite 的 connector。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
tokio-util = { version = "0.7.13", features = ["rt"] }
# 媒体面的抖动缓冲要与读循环同步（`Mutex` + `Condvar`）。workspace 已有这个包。
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { workspace = true }
futures-util = "0.3.31"
# `--session-json` 那个文件要读进来再原样发出去（`--dry-run` 也要把它打出来），
# 所以 example 需要直接操作 serde_json。workspace 里早就有它（vox-core 的依赖），
# `Cargo.lock` 一个新包都不进。
serde_json.workspace = true
# 只给 `examples/aliyun_probe.rs --keyring` 那条腿用（Secret Service 的键名与
# 取值规则都在 vox-host 那边，探针不另抄一份）。**dev-dependency 进不了依赖方的树**，
# 所以 `cargo tree -p vox-headless` 跟改动前一致。
# keyring/zbus 则藏在下面的 `probe-keyring` 后面（vox-host 的 `secret-service` 默认关）。
vox-host = { path = "../vox-host" }
# `--list-models` 要发 HTTPS GET。与 `app/src-tauri` 的写法逐字相同（同一个 reqwest
# 0.12 已经在 `Cargo.lock` 里、feature 也一致），所以**零新包**，只多一行依赖名。
# 同样只挂 dev 边：`cargo tree -p vox-headless` 一个包都不多。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# 本地 TLS WebSocket 服务端测试用的自签证书。
rcgen = "0.13"

[features]
default = []
# 探针从 Secret Service 读密钥的那一条腿。关着的时候 vox-host 的
# `SecretBackend::SecretService` 造出一个"明确报错、绝不静默降级"的后端
# （`secrets::UnavailableStore`），所以探针代码本身不需要 `cfg`，
# 缺 feature 时 `--keyring` 报的是"需要 Linux + secret-service feature"。
# `cargo run -p vox-net --features probe-keyring --example aliyun_probe -- --keyring …`
probe-keyring = ["vox-host/secret-service"]

# 把 example 显式列出来只为一件事：`cargo test` 默认**不跑 example 里的 `#[test]`**
# （只 build 它们），不写这段的话 `aliyun_probe` 的 15 条单测永远不会被 CI / gate 跑到。
# `test = true` + `harness = true` 是默认值，写出来是为了让"为什么有这一段"看得见；
# 跑法：`cargo test -p vox-net --examples`。
[[example]]
name = "aliyun_probe"
path = "examples/aliyun_probe.rs"
test = true
