[package]
name = "vox-headless"
description = "无屏档（小主板 ARM64 Linux）入口：芯 + PipeWire + 配置进 / 状态出 + 控制面，不引 Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

# 依赖表跟桌面装配层（`app/src-tauri/Cargo.toml`）的**芯侧那一段**一致，只有两条差别：
#
# - **没有 Tauri**（也没有 tauri-plugin-*、GTK、WebKitGTK）：无屏盒子上这些东西既装不了
#   也不需要——验收会拿 `cargo tree -p vox-headless | grep -c tauri` 钉成 0。
# - **没有平台外壳的其余三件**（`vox-input-linux` 热键 / `vox-overlay-*` 字幕窗 /
#   `vox-audio-win` 等）：无屏档不启动热键、不画字幕（`docs/platform/EMBEDDED.md` §3.7）。
#
# 一个包都不新增：`tracing-subscriber` / `chrono` / `tokio` / `serde` 全在 `Cargo.lock` 里
# 且已被桌面装配层用过（`git diff Cargo.lock` 只多出本 crate 自己那一格）。
[dependencies]
vox-core.workspace = true
vox-dsp.workspace = true
vox-net = { path = "../vox-net" }
vox-mcp = { path = "../vox-mcp" }
# 共享宿主层（S4-A）。**不开** `secret-service`：无屏盒子常常没有 keyring 守护
# （EMBEDDED §3.6），开了会把 keyring/zbus 拖进这棵依赖树——
# `cargo tree -p vox-headless | grep -ciE '\b(tauri|tao|wry|gtk|webkit2gtk|keyring|zbus)\b'` = 0
# 是验收项。密钥走 `SecretBackend::File`（配置目录下的 0600 文件）。
vox-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot.workspace = true
tokio.workspace = true
# 本地日期（用量按天/按月分桶）走挂钟时间 + 本地时区，跟桌面侧的 `platform/linux/clock.rs`
# 同一套口径。只要 clock + std，不要默认那一堆。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 无屏档复用桌面 Linux 那一份音频后端（PipeWire），不新写一行采集/播放。
vox-audio-linux = { path = "../vox-audio-linux" }
