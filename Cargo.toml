[workspace]
resolver = "2"
members = [
    "crates/vox-core",
    "crates/vox-dsp",
    "crates/vox-net",
    "crates/vox-audio-win",
    "crates/vox-audio-linux",
    "crates/vox-audio-alsa",
    "crates/vox-input-linux",
    "crates/vox-input-win",
    "crates/vox-overlay-core",
    "crates/vox-overlay-linux",
    "crates/vox-overlay-win",
    "crates/vox-osc",
    "crates/vox-mcp",
    # 共享宿主层：两个装配层（桌面 / 无屏）共用的那一半。放进 workspace 是为了让
    # `cargo test/clippy --workspace` 真的覆盖到它。
    "crates/vox-host",
    # 两个装配层。放进 workspace 是为了让 `cargo test/clippy --workspace` 真的覆盖到它。
    "app/src-tauri",
    # 无屏档（小主板 ARM64 Linux）的入口：跟 app 并列的第二个外壳，**不依赖 Tauri**。
    "crates/vox-headless",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Vox"]

[patch.crates-io]
# openvr_sys 2.0.3 ships checked-in bindings, so ordinary builds do not need
# bindgen/libclang.  Keep this patch local and reproducible for SteamVR builds.
openvr_sys = { path = "vendor/openvr_sys" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
parking_lot = "0.12"
vox-core = { path = "crates/vox-core" }
vox-dsp = { path = "crates/vox-dsp" }
vox-overlay-core = { path = "crates/vox-overlay-core" }
vox-host = { path = "crates/vox-host" }
# 三个 Windows crate 共用同一个版本，避免同时链两份 windows。
windows = "0.62"
rubato = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# rustls 0.23 不再自动选 crypto provider，必须显式启用一个（ring / aws-lc-rs）
# 并在进程启动时 install_default()。选 ring：纯 Rust 实现，无 C 工具链依赖
# （不引 aws-lc-rs），也关掉 rustls 默认 feature 以免同时拉两个 provider。
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
